  **الاستيراد:** File → Import → اختر هذا الملف + ملف البيئة `awqaf-dar.local.postman_environment.json`

  **الترتيب:** Health → Login → باقي الطلبات المحمية.

  **أسبوع 7:** عنوان المركز + فلتر نسائي/رجالي في centers/public.

  **أسبوع 8 يوم 1:** مجلد 10 — Sessions (CRUD حصص).
