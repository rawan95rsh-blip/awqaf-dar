$kind: http-request
description: قائمة فصول المركز (مطور + دورة).
url: "{{baseUrl}}/api/class-offers"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('array', () => pm.expect(res.data).to.be.an('array'));
      if (res.data?.[0]?.id) pm.environment.set('classOfferId', res.data[0].id);
      if (res.data?.[0]?.nextSessionId) pm.environment.set('sessionId', res.data[0].nextSessionId);
    language: text/javascript
order: 1000
