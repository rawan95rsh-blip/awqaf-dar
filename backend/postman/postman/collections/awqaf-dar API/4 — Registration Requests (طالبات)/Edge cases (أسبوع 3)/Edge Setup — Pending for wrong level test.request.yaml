$kind: http-request
description: إعداد — طلب pending لاختبار levelId من مركز آخر.
url: "{{baseUrl}}/api/registration-requests"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "fullName": "طالبة مستوى خاطئ",
      "idNumber": "{{edgeWrongLevelIdNumber}}",
      "gender": "female",
      "nationality": "{{studentNationality}}",
      "academicLevel": "{{studentAcademicLevel}}",
      "track": "mutor",
      "phone": "{{edgeWrongLevelPhone}}",
      "password": "{{studentPassword}}",
      "dob": "2010-05-15",
      "centerId": "{{centerId}}",
      "requestedLevelId": "{{levelId}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      pm.test('Setup 201', () => pm.response.to.have.status(201));
      if (res.data?.id) pm.environment.set('edgeWrongLevelRequestId', res.data.id);
    language: text/javascript
order: 10000
