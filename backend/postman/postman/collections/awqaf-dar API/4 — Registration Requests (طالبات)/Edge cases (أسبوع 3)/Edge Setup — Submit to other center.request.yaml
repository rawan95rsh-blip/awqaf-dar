$kind: http-request
description: إعداد — طلب لمركز ثانٍ. شغّلي List Public Centers + List Levels — Other Center أولاً.
url: "{{baseUrl}}/api/registration-requests"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "fullName": "طالبة مركز آخر",
      "idNumber": "{{edgeOtherCenterIdNumber}}",
      "gender": "female",
      "nationality": "{{studentNationality}}",
      "academicLevel": "{{studentAcademicLevel}}",
      "track": "mutor",
      "phone": "{{edgeOtherCenterPhone}}",
      "password": "{{studentPassword}}",
      "dob": "2010-05-15",
      "centerId": "{{otherCenterId}}",
      "requestedLevelId": "{{otherCenterLevelId}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      pm.test('Setup 201', () => pm.response.to.have.status(201));
      if (res.data?.id) pm.environment.set('otherCenterRegistrationRequestId', res.data.id);
    language: text/javascript
order: 5000
