$kind: http-request
description: أسبوع 7 — قائمة المراكز النشطة مع العنوان و genderAudience.
url: "{{baseUrl}}/api/centers/public"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('has centers', () => pm.expect(res.data.length).to.be.at.least(1));
      pm.test('has address fields', () => {
        pm.expect(res.data[0]).to.have.property('addressText');
        pm.expect(res.data[0]).to.have.property('city');
        pm.expect(res.data[0]).to.have.property('genderAudience');
      });
      if (res.data?.[0]?.id) pm.environment.set('centerId', res.data[0].id);
      if (res.data?.[1]?.id) pm.environment.set('otherCenterId', res.data[1].id);
    language: text/javascript
order: 2000
