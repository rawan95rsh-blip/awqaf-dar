$kind: http-request
description: أسبوع 7 — فلتر نسائي فقط (بدون مختلط).
url: "{{baseUrl}}/api/centers/public?audience=female"
method: GET
queryParams:
  audience: female
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('only female centers', () => {
        const bad = (res.data || []).filter(c => c.genderAudience !== 'female');
        pm.expect(bad.length).to.eql(0);
      });
    language: text/javascript
order: 3000
