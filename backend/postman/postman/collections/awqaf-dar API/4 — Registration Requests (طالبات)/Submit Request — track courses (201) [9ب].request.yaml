$kind: http-request
description: |-
  الأسبوع 3 — طلب تسجيل طالبة.
  **idNumber ثابت** — لا يتغير بعد الموافقة.
url: "{{baseUrl}}/api/registration-requests"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "fullName": "اختبار كلمة المرور",
      "idNumber": "001999888779",
      "gender": "female",
      "nationality": "{{studentNationality}}",
      "academicLevel": "{{studentAcademicLevel}}",
      "track": "courses",
      "phone": "0599111224",
      "password": "123456",
      "dob": "2010-05-15",
      "centerId": "{{centerId}}",
      "requestedLevelId": "{{levelId}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("status 201", function () {
        pm.response.to.have.status(201);
      });
    language: text/javascript
order: 8000
