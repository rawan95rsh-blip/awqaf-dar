$kind: http-request
description: |-
  الأسبوع 2 — تحقق OTP.

  في التطوير استخدمي الكود **7890** (من DEV_VERIFICATION_CODE).

  بعد النجاح يُحفظ token تلقائياً.
url: "{{baseUrl}}/api/auth/verify-center"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "phone": "{{newCenterPhone}}",
      "code": "7890"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('success true', () => pm.expect(res.success).to.eql(true));
      if (res.data?.token) {
        pm.environment.set('token', res.data.token);
      }
      if (res.data?.user?.id) {
        pm.environment.set('userId', res.data.user.id);
      }
      if (res.data?.user?.centerProfile?.id) {
        pm.environment.set('centerId', res.data.user.centerProfile.id);
      }
    language: text/javascript
order: 2000
