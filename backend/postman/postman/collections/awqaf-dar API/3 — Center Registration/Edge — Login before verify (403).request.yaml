$kind: http-request
description: |-
  حالة حافة — login قبل verify → 403.

  **الترتيب:**
  1. Register Center بهاتف جديد (يُحفظ في pendingCenterPhone يدوياً أو عبر prerequest)
  2. شغّلي هذا الطلب **قبل** Verify Center
  3. المتوقع: 403 — الحساب غير مفعّل
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "phone": "{{pendingCenterPhone}}",
      "password": "{{newCenterPassword}}"
    }
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      // سجّلي مركزاً جديداً أولاً عبر Register Center بهاتف فريد
      // ثم شغّلي هذا الطلب قبل Verify Center
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status 403', () => pm.response.to.have.status(403));
      const res = pm.response.json();
      pm.test('not activated', () => pm.expect(res.error).to.include('غير مفعّل'));
    language: text/javascript
order: 5000
