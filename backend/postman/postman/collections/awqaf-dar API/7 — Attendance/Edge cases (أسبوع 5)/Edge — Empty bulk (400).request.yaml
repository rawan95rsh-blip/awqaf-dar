$kind: http-request
description: حالة حافة — bulk فارغ → 400.
url: "{{baseUrl}}/api/attendance/bulk"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "levelId": "{{levelId}}",
      "subjectIndex": 0,
      "date": "2026-07-08",
      "records": []
    }
scripts:
