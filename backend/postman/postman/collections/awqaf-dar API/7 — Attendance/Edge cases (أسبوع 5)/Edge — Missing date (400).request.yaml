$kind: http-request
description: حالة حافة — تاريخ فارغ → 400.
url: "{{baseUrl}}/api/attendance?levelId={{levelId}}&subjectIndex=0"
method: GET
queryParams:
  levelId: "{{levelId}}"
  subjectIndex: "0"
scripts:
