$kind: http-request
description: أسبوع 6 — تغيير كلمة المرور.
url: "{{baseUrl}}/api/account/password"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "currentPassword": "{{centerAdminPassword}}",
      "newPassword": "654321"
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('success true', () => pm.expect(res.success).to.eql(true));
      pm.test('password changed', () => pm.expect(res.data.message).to.include('تم تغيير'));
    language: text/javascript
order: 3000
