$kind: http-request
description: أسبوع 8 — تفاصيل حصة.
url: "{{baseUrl}}/api/sessions/{{sessionId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('has title', () => pm.expect(res.data.title).to.be.a('string'));
    language: text/javascript
order: 4000
