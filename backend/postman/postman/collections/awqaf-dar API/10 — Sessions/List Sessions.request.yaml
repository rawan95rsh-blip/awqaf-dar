$kind: http-request
description: أسبوع 8 — قائمة حصص المركز.
url: "{{baseUrl}}/api/sessions"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('array', () => pm.expect(res.data).to.be.an('array'));
      if (res.data?.[0]?.id) pm.environment.set('sessionId', res.data[0].id);
    language: text/javascript
order: 1000
