$kind: http-request
description: أسبوع 8 — تحديث حصة.
url: "{{baseUrl}}/api/sessions/{{sessionId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "title": "حصة محدّثة — Postman",
      "status": "scheduled",
      "notes": "تم التحديث"
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('saved', () => pm.expect(res.data.message).to.include('تم تحديث'));
    language: text/javascript
order: 5000
