$kind: http-request
description: أسبوع 7 — قراءة عنوان المركز (نص فقط).
url: "{{baseUrl}}/api/settings/center-profile"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('has addressText', () => pm.expect(res.data).to.have.property('addressText'));
      pm.test('has city', () => pm.expect(res.data).to.have.property('city'));
      pm.test('has nameAr', () => pm.expect(res.data.nameAr).to.be.a('string'));
    language: text/javascript
order: 2000
