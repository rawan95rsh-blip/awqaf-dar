$kind: http-request
url: "{{baseUrl}}/api/suspension-requests"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "reason": "ظروف خاصة"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 201', () => pm.response.to.have.status(201));
      const res = pm.response.json();
      if (res.data?.id) pm.environment.set('suspensionRequestId', res.data.id);
    language: text/javascript
order: 1000
