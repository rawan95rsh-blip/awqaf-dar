$kind: http-request
description: |-
  أسبوع 5 — حضور الطالبة (آخر 30 يوماً + تقويم).
  شغّلي Login + List Students أو Level Students أولاً.
url: "{{baseUrl}}/api/students/{{studentId}}/attendance"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('success true', () => pm.expect(res.success).to.eql(true));
      pm.test('has calendar', () => pm.expect(res.data.calendar).to.be.an('array'));
    language: text/javascript
order: 9000
