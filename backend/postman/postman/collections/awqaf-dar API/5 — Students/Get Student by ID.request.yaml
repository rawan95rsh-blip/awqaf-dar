$kind: http-request
description: |-
  أسبوع 4 — ملف الطالبة.
  شغّلي List Students أولاً لملء `studentId`.
url: "{{baseUrl}}/api/students/{{studentId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('success true', () => pm.expect(res.success).to.eql(true));
      pm.test('has profile fields', () => {
        pm.expect(res.data.id).to.eql(pm.environment.get('studentId'));
        pm.expect(res.data).to.have.property('idNumber');
        pm.expect(res.data).to.have.property('level');
        pm.expect(res.data.grades).to.be.an('array');
        pm.expect(res.data.attendanceCalendar).to.be.an('array');
      });
    language: text/javascript
order: 4000
