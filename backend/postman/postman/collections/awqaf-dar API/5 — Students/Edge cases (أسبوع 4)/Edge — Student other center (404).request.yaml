$kind: http-request
description: |-
  حالة حافة — طالبة من مركز آخر (مركز النور) → 404.
  1) `npm run seed` → انسخي `otherCenterStudentId` إلى Environment
  2) Login — Center Admin (مركز تجريبي)
url: "{{baseUrl}}/api/students/{{otherCenterStudentId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      pm.test('Status 404', () => pm.response.to.have.status(404));
      pm.test('not found', () => pm.expect(res.error).to.include('لم يُعثر'));
    language: text/javascript
order: 4000
