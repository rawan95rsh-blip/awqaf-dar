$kind: http-request
description: مشرف يعيّن enrolled | graduated | suspended
url: "{{baseUrl}}/api/students/{{studentId}}/enrollment-status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "enrollmentStatus": "graduated"
    }
scripts:
  - type: afterResponse
    code: pm.test('status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 10000
