# Render Blueprint — نشر awqaf-dar API
# Dashboard → New → Blueprint → الريبو awqaf-dar (فرع main)
# أو: https://dashboard.render.com/blueprint/new?repo=https://github.com/rawan95rsh-blip/awqaf-dar

services:
  - type: web
    name: awqaf-dar-api
    runtime: node
    plan: free
    branch: main
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
